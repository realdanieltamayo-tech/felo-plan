[Service]
# Felo: put local fixes back (Opus 5.5 patch, faster-whisper) before every Hermes start, so a Hermes update
# never runs without them. "-" = Hermes still starts if a fix fails (the 15-minute check then alerts Daniel).
ExecStartPre=-/usr/local/sbin/felo-hermes-fixes --no-restart
TimeoutStartSec=300
